name: Release

# When manifest.json on main has a version without a release yet, build the plugin
# and publish a release with main.js and manifest.json. The tag (e.g. 0.2.0,
# without "v", as Obsidian expects) is created by the release itself.
on:
  push:
    branches: [main]
    paths: [manifest.json, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          version=$(node -p "require('./manifest.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$version" > /dev/null 2>&1; then
            echo "Release $version already exists"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.version.outputs.exists != 'true'
        with:
          node-version: 22
          cache: npm

      - if: steps.version.outputs.exists != 'true'
        run: npm ci

      - if: steps.version.outputs.exists != 'true'
        run: npm run build

      - name: Create release
        if: steps.version.outputs.exists != 'true'
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.version }}" \
            --generate-notes \
            main.js manifest.json
