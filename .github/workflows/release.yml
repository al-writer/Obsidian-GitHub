name: Release

# Push a tag equal to the version in manifest.json (e.g. 0.2.0, without "v")
# to build the plugin and publish a GitHub release with main.js and manifest.json.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check that the tag matches manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $version"
            exit 1
          fi

      - run: npm ci

      - run: npm run build

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            main.js manifest.json
